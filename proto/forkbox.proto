// The forkboxd API (gRPC; Unix socket by default).
//
// Error codes, for every RPC:
//   NOT_FOUND            no such sandbox or template, or a missing guest file
//   INVALID_ARGUMENT     a malformed request: bad id, empty command, relative path
//   FAILED_PRECONDITION  the sandbox is not running (creating, destroying, failed)
//   ALREADY_EXISTS       the sandbox id is taken
//   RESOURCE_EXHAUSTED   the host cannot take another sandbox
//   DEADLINE_EXCEEDED    the guest agent did not answer in time
//   UNAVAILABLE          the guest agent cannot be reached
//   UNAUTHENTICATED      missing or wrong bearer token (TCP listener only)
//   INTERNAL             anything else; the message says what failed
syntax = "proto3";

package forkbox.v1;

option go_package = "github.com/Lazypilottt/forkbox/proto/forkboxpb";

service Forkbox {
  // Restores a sandbox from a template's base snapshot. Returns once the
  // guest agent answers, with per-step timings.
  rpc CreateSandbox(CreateSandboxRequest) returns (Sandbox);
  rpc GetSandbox(GetSandboxRequest) returns (Sandbox);
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  // Runs a command; streams started, then stdout/stderr chunks, then exit.
  // Cancelling the call kills the command's process group in the guest.
  rpc Exec(ExecRequest) returns (stream ExecEvent);
  // Streams a guest file; the last message carries its size and SHA-256.
  rpc ReadFile(ReadFileRequest) returns (stream FileChunk);
  // First message is the header, then data chunks. The file appears in the
  // guest only once complete.
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  rpc DestroySandbox(DestroySandboxRequest) returns (DestroySandboxResponse);
  // Forwards a host TCP port to a guest port (for previews). host_port 0
  // picks a free port. Forwards end when the sandbox is destroyed.
  rpc ExposePort(ExposePortRequest) returns (ExposePortResponse);
  // Forks a running sandbox into n children that continue from its state.
  // The parent is paused only for the diff snapshot and the disk copies.
  rpc ForkSandbox(ForkSandboxRequest) returns (ForkSandboxResponse);
  // Checkpoints: a named memory layer plus a disk copy. They outlive the
  // sandbox until deleted.
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (Checkpoint);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  // Restores a checkpoint into a fresh VM with the same sandbox id, network
  // slot and port forwards; the old VM is stopped.
  rpc RewindSandbox(RewindSandboxRequest) returns (Sandbox);
  // Creates a separate sandbox from a checkpoint.
  rpc RestoreCheckpoint(RestoreCheckpointRequest) returns (Sandbox);
  rpc DeleteCheckpoint(DeleteCheckpointRequest) returns (DeleteCheckpointResponse);
}

message Sandbox {
  string id = 1;
  string template = 2;    // template name
  string template_id = 3; // content-addressed template id
  string parent = 4;      // sandbox it was forked from, if any
  string state = 5;       // creating, running, destroying, failed
  int64 created_at_unix_ms = 6;
  uint64 ttl_s = 7;       // 0: no expiry
  int32 pid = 8;          // Firecracker process on the host
  CreateTimings timings = 9; // only in the CreateSandbox answer
}

message CreateTimings {
  double total_ms = 1;
  double disk_ms = 2;     // reflink of the template disk
  double restore_ms = 3;  // jail + snapshot load
  double resume_ms = 4;
  double agent_ms = 5;    // until the guest agent answered
  double identity_ms = 6; // reseed, machine-id, hostname, clock
}

message CreateSandboxRequest {
  string template = 1; // name or id
  uint64 ttl_s = 2;
}

message GetSandboxRequest {
  string id = 1;
}

message ListSandboxesRequest {}

message ListSandboxesResponse {
  repeated Sandbox sandboxes = 1;
}

message ExecRequest {
  string sandbox_id = 1;
  repeated string args = 2; // argv; use ["sh", "-c", "..."] for a shell
  repeated string env = 3;  // KEY=value
  string cwd = 4;
  uint64 timeout_ms = 5;    // 0: none
}

message ExecEvent {
  oneof event {
    ExecStarted started = 1;
    bytes stdout = 2;
    bytes stderr = 3;
    ExecExit exit = 4;
  }
}

message ExecStarted {
  string exec_id = 1;
  int32 pid = 2;
}

message ExecExit {
  int32 exit_code = 1; // -1 if killed by a signal
  string signal = 2;
  bool timed_out = 3;
  double duration_ms = 4;
}

message ReadFileRequest {
  string sandbox_id = 1;
  string path = 2; // absolute
}

message FileChunk {
  bytes data = 1;
  bool last = 2;    // set on the final message
  uint64 size = 3;  // final message only
  bytes sha256 = 4; // final message only
}

message WriteFileHeader {
  string sandbox_id = 1;
  string path = 2;  // absolute
  uint32 mode = 3;  // 0: 0644
  bool make_parents = 4;
}

message WriteFileRequest {
  oneof msg {
    WriteFileHeader header = 1;
    bytes data = 2;
  }
}

message WriteFileResponse {
  uint64 size = 1;
  bytes sha256 = 2;
}

message DestroySandboxRequest {
  string id = 1;
}

message DestroySandboxResponse {}

message ExposePortRequest {
  string sandbox_id = 1;
  uint32 guest_port = 2;
  uint32 host_port = 3; // 0: any free port
}

message ForkSandboxRequest {
  string id = 1;
  uint32 n = 2;           // 1 to 256
  uint32 concurrency = 3; // parallel restores; 0: one per host CPU
}

message ForkTimings {
  double pause_ms = 1;
  double snapshot_ms = 2;      // diff snapshot
  double disks_ms = 3;         // reflinks of the parent's disk
  double resume_ms = 4;
  double parent_paused_ms = 5; // pause through resume
  double merge_ms = 6;         // diff onto the parent's base layer
  repeated double restore_ms = 7; // per child, until its agent is ready
  double total_ms = 8;
  uint64 diff_bytes = 9;       // allocated size of the diff memory file
  uint64 dirty_bytes = 10;     // dirty memory merged
}

message ForkSandboxResponse {
  repeated Sandbox children = 1;
  ForkTimings timings = 2;
  string layer = 3; // the memory layer the children were restored from
}

message Checkpoint {
  string id = 1;
  string sandbox_id = 2;
  string name = 3;
  string layer = 4;
  int64 created_at_unix_ms = 5;
  double paused_ms = 6;  // only when just created
  uint64 dirty_bytes = 7; // only when just created
}

message CreateCheckpointRequest {
  string sandbox_id = 1;
  string name = 2;
}

message ListCheckpointsRequest {
  string sandbox_id = 1; // empty: all
}

message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}

message RewindSandboxRequest {
  string sandbox_id = 1;
  string name = 2; // or the checkpoint id
}

message RestoreCheckpointRequest {
  string sandbox_id = 1; // the sandbox it was taken from (with a name)
  string name = 2;       // a name, or the checkpoint id
  uint64 ttl_s = 3;
}

message DeleteCheckpointRequest {
  string sandbox_id = 1;
  string name = 2; // or the checkpoint id
}

message DeleteCheckpointResponse {}

message ExposePortResponse {
  string host = 1;      // address the forward listens on
  uint32 host_port = 2;
}
