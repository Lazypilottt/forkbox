name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STATICCHECK_VERSION: "2026.2.2"

jobs:
  unit:
    name: vet, staticcheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...
      - name: unit tests
        run: go test -race ./...
      # Python packages arrive in Task 6; this step starts running once they exist.
      - name: pytest
        if: hashFiles('sdk/python/pyproject.toml') != ''
        run: |
          python3 -m pip install -e 'sdk/python[test]'
          python3 -m pytest sdk/python

  integration:
    name: integration tests (KVM)
    needs: unit
    # GitHub's standard Linux runners expose hardware virtualization; the
    # job grants access to /dev/kvm and runs real Firecracker microVMs.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: host
        run: |
          uname -a; nproc; free -h; df -h / /mnt 2>/dev/null || true
          grep -cwE 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm flags"
          ls -l /dev/kvm || true
          cat /sys/fs/cgroup/cgroup.subtree_control
      - name: enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends squashfs-tools e2fsprogs xfsprogs nftables
      - name: data dir on reflink XFS
        run: |
          # A sparse loop file on whichever disk has more room.
          dir=/mnt
          if [ "$(df --output=avail -B1 / | tail -1)" -gt "$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)" ]; then dir=/var/tmp; fi
          sudo truncate -s 24G "$dir/forkbox-data.img"
          sudo mkfs.xfs -q -m reflink=1 "$dir/forkbox-data.img"
          sudo mkdir -p /var/lib/forkbox
          sudo mount -o loop "$dir/forkbox-data.img" /var/lib/forkbox
          df -hT /var/lib/forkbox
      - name: forkbox setup
        run: |
          go build -o bin/forkbox ./cmd/forkbox
          sudo -n bin/forkbox setup
      - name: forkbox doctor
        run: sudo -n bin/forkbox doctor
      - name: integration tests
        run: make integration GOTESTFLAGS="-v -timeout 30m"
      - name: doctor in a container without /dev/kvm
        run: |
          CGO_ENABLED=0 go build -o bin/forkbox-static ./cmd/forkbox
          set +e
          out=$(docker run --rm -v "$PWD/bin/forkbox-static:/forkbox:ro" ubuntu:24.04 /forkbox doctor 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q '/dev/kvm does not exist inside this container'
