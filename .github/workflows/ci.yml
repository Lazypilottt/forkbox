name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: "Also run bench/fork_curve.py (about 15 minutes)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  STATICCHECK_VERSION: "2026.2.2"

jobs:
  unit:
    name: vet, staticcheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION} ./...
      - name: unit tests
        run: go test -race ./...
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pytest
        run: |
          python -m pip install -q -e 'sdk/python[test]' -e 'mcp[test]'
          python -m pytest -q sdk/python mcp

  integration:
    name: integration tests (KVM)
    needs: unit
    # GitHub's standard Linux runners expose hardware virtualization; the
    # job grants access to /dev/kvm and runs real Firecracker microVMs.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: host
        run: |
          uname -a; nproc; free -h; df -h / /mnt 2>/dev/null || true
          grep -cwE 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm flags"
          ls -l /dev/kvm || true
          cat /sys/fs/cgroup/cgroup.subtree_control
      - name: enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends squashfs-tools e2fsprogs xfsprogs nftables tcpdump
      # Host setup an operator does once (Forkbox never changes host network
      # settings or other firewall tables itself): IPv4 forwarding, and,
      # because Docker sets the FORWARD policy to drop, accepting the
      # sandbox address pool in Docker's DOCKER-USER chain.
      - name: host forwarding for sandboxes
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          if sudo iptables -n -L DOCKER-USER >/dev/null 2>&1; then
            sudo iptables -I DOCKER-USER -s 10.200.0.0/16 -j ACCEPT
            sudo iptables -I DOCKER-USER -d 10.200.0.0/16 -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          fi
      - name: data dir on reflink XFS
        run: |
          # A sparse loop file on whichever disk has more room.
          dir=/mnt
          if [ "$(df --output=avail -B1 / | tail -1)" -gt "$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)" ]; then dir=/var/tmp; fi
          sudo truncate -s 24G "$dir/forkbox-data.img"
          sudo mkfs.xfs -q -m reflink=1 "$dir/forkbox-data.img"
          sudo mkdir -p /var/lib/forkbox
          sudo mount -o loop "$dir/forkbox-data.img" /var/lib/forkbox
          df -hT /var/lib/forkbox
      - name: forkbox setup
        run: |
          go build -o bin/forkbox ./cmd/forkbox
          sudo -n bin/forkbox setup
      - name: forkbox doctor
        run: sudo -n bin/forkbox doctor
      - name: templates
        run: |
          make build
          sudo -n bin/forkbox templates build templates/python.yaml
          sudo -n bin/forkbox templates build templates/node.yaml
          # An unchanged spec is a no-op.
          start=$(date +%s)
          out=$(sudo -n bin/forkbox templates build templates/python.yaml)
          echo "$out"
          echo "$out" | grep -q 'is up to date'
          test $(( $(date +%s) - start )) -lt 5
          sudo -n bin/forkbox templates list
          sudo -n bin/forkbox templates inspect python
          sudo -n bin/forkbox templates inspect node
      - name: integration tests
        run: make integration GOTESTFLAGS="-v -timeout 40m"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: forkboxd
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e 'sdk/python[test]' -e 'mcp[test]' matplotlib
          sudo -n sh -c 'bin/forkboxd > /var/lib/forkbox/forkboxd.log 2>&1 &'
          for i in $(seq 1 50); do sudo -n test -S /var/lib/forkbox/run/forkboxd.sock && break; sleep 0.2; done
          sudo -n stat -c '%a %U %n' /var/lib/forkbox/run /var/lib/forkbox/run/forkboxd.sock
      - name: SDK against the daemon
        run: |
          sudo -n env FORKBOX_INTEGRATION=1 "$RUNNER_TEMP/venv/bin/python" -m pytest -v -m integration sdk/python
          sudo -n env FORKBOX_INTEGRATION=1 "$RUNNER_TEMP/venv/bin/python" -m pytest -v -m integration mcp
      - name: README quick start
        run: sudo -n "$RUNNER_TEMP/venv/bin/python" examples/quickstart.py
      - name: bench/restore.py
        run: sudo -n "$RUNNER_TEMP/venv/bin/python" bench/restore.py --runs 100
      - name: bench/fork_curve.py
        if: github.event_name == 'workflow_dispatch' && inputs.bench
        run: |
          sudo -n bin/forkbox templates build bench/fork-template.yaml
          sudo -n "$RUNNER_TEMP/venv/bin/python" bench/fork_curve.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: ignore
      - name: forkboxd log
        if: always()
        run: sudo -n cat /var/lib/forkbox/forkboxd.log || true
      - name: doctor in a container without /dev/kvm
        run: |
          CGO_ENABLED=0 go build -o bin/forkbox-static ./cmd/forkbox
          set +e
          out=$(docker run --rm -v "$PWD/bin/forkbox-static:/forkbox:ro" ubuntu:24.04 /forkbox doctor 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q '/dev/kvm does not exist inside this container'
