[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forkbox-mcp"
version = "0.2.0"
description = "MCP server for Forkbox: sandboxes that fork in milliseconds, as agent tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Aditya" }]
dependencies = ["forkbox>=0.1.0", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
forkbox-mcp = "forkbox_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forkbox_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running forkboxd on a KVM host (FORKBOX_INTEGRATION=1)"]
